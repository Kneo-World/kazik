<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brainrots Funny</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151921;
            --accent-blue: #2b6bf3;
            --accent-gold: #f5a623;
            --text-main: #ffffff;
            --text-muted: #8c93a4;
            --border-color: #222834;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            padding-bottom: 70px;
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            background: #11141d;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            overflow: hidden;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
        }

        .balance-badge {
            background: #1c2230;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 14px;
        }

        /* NAV TABS */
        .tabs {
            display: flex;
            background: #11141d;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .tab-btn i {
            font-size: 16px;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue);
        }

        /* SECTIONS */
        .section {
            display: none;
            padding: 16px;
        }

        .section.active {
            display: block;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 14px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* CASES GRID */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .case-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .case-card:active {
            transform: scale(0.97);
        }

        .case-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto 10px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        .case-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .case-price {
            font-size: 13px;
            color: var(--accent-gold);
            font-weight: 600;
        }

        /* MODAL OPEN CASE */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 20px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .multiplier-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
        }

        .mult-btn {
            background: #1c2230;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .mult-btn.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        .btn-open {
            background: var(--accent-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-open:disabled {
            background: #2a3245;
            color: #5d667a;
        }

        .case-preview-loot {
            margin-top: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            max-height: 180px;
            overflow-y: auto;
        }

        .loot-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .loot-item-mini {
            background: #1c2230;
            border-radius: 8px;
            padding: 6px;
            font-size: 11px;
        }

        .loot-item-mini img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        /* WINNER DISPLAY */
        .won-items-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .won-card {
            background: #1c2230;
            border: 1px solid var(--accent-gold);
            border-radius: 10px;
            padding: 10px;
            width: 90px;
            text-align: center;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .won-card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .won-card-title {
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }

        .won-card-price {
            font-size: 11px;
            color: var(--accent-gold);
        }

        /* UPGRADER */
        .upgrader-circle-box {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto;
        }

        .circle-svg {
            transform: rotate(-90deg);
        }

        .upgrader-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .upgrade-slots {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .slot {
            flex: 1;
            background: var(--card-bg);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 8px;
        }

        .slot img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        /* INVENTORY GRID */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 10px;
            border: 1px solid var(--border-color);
            text-align: center;
            cursor: pointer;
        }

        .item-card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 6px;
        }

        .item-name {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-price {
            font-size: 12px;
            color: var(--accent-gold);
            font-weight: 700;
            margin-top: 2px;
        }

        .sell-btn {
            background: #d93838;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 10px;
            margin-top: 6px;
            cursor: pointer;
            width: 100%;
        }

        .empty-inv {
            grid-column: span 3;
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="user-profile">
            <div class="user-avatar" id="user-avatar">?</div>
            <div class="user-info">
                <div class="user-name" id="user-name">Гость</div>
                <div style="font-size: 11px; color: var(--text-muted);">Brainrots Funny</div>
            </div>
        </div>
        <div class="balance-badge">
            <i class="fa-solid fa-coins"></i>
            <span id="balance">0</span>
        </div>
    </header>

    <!-- NAVIGATION TABS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('cases')">
            <i class="fa-solid fa-box-open"></i> Кейсы
        </button>
        <button class="tab-btn" onclick="switchTab('upgrader')">
            <i class="fa-solid fa-bolt"></i> Апгрейдер
        </button>
        <button class="tab-btn" onclick="switchTab('inventory')">
            <i class="fa-solid fa-sack-dollar"></i> Инвентарь
        </button>
    </div>

    <!-- SECTION 1: CASES -->
    <div id="section-cases" class="section active">
        <div class="section-title"><i class="fa-solid fa-cubes"></i> Список Кейсов</div>
        <div class="cases-grid">
            
            <!-- FREE CASE -->
            <div class="case-card" onclick="openCaseModal('free')">
                <img src="assets/cases/free.png" class="case-img" alt="Free Case" onerror="this.src='https://via.placeholder.com/100?text=FREE'">
                <div class="case-title">Бесплатный</div>
                <div class="case-price" id="free-timer-text">БЕСПЛАТНО</div>
            </div>

            <!-- BASE CASE -->
            <div class="case-card" onclick="openCaseModal('base')">
                <img src="assets/cases/base.png" class="case-img" alt="Base Case" onerror="this.src='https://via.placeholder.com/100?text=BASE'">
                <div class="case-title">Начальный</div>
                <div class="case-price"><i class="fa-solid fa-coins"></i> 9 монет</div>
            </div>

        </div>
    </div>

    <!-- SECTION 2: UPGRADER -->
    <div id="section-upgrader" class="section">
        <div class="section-title"><i class="fa-solid fa-bolt"></i> Прокачка Брейнротов</div>
        
        <div class="upgrade-slots">
            <div class="slot" id="slot-input" onclick="switchTab('inventory')">
                <span style="font-size: 11px; color: var(--text-muted);">Выбрать из инвентаря</span>
            </div>
            <div style="display: flex; align-items: center; color: var(--text-muted);"><i class="fa-solid fa-arrow-right"></i></div>
            <div class="slot" id="slot-target" onclick="openShopSelector()">
                <span style="font-size: 11px; color: var(--text-muted);">Выбрать цель</span>
            </div>
        </div>

        <div class="upgrader-circle-box">
            <svg class="circle-svg" width="200" height="200">
                <circle cx="100" cy="100" r="80" stroke="#1c2230" stroke-width="12" fill="none" />
                <circle id="upgrade-progress" cx="100" cy="100" r="80" stroke="var(--accent-blue)" stroke-width="12" fill="none" 
                        stroke-dasharray="502" stroke-dashoffset="502" style="transition: stroke-dashoffset 0.5s ease;" />
            </svg>
            <div class="upgrader-info">
                <div style="font-size: 12px; color: var(--text-muted);">ШАНС</div>
                <div id="upgrade-chance" style="font-size: 26px; font-weight: 800;">0%</div>
            </div>
        </div>

        <button class="btn-open" id="btn-upgrade" onclick="runUpgrade()" disabled>ПРОКАЧАТЬ</button>
    </div>

    <!-- SECTION 3: INVENTORY -->
    <div id="section-inventory" class="section">
        <div class="section-title" style="justify-content: space-between;">
            <span><i class="fa-solid fa-sack-dollar"></i> Мой Инвентарь</span>
            <button onclick="sellAll()" style="background: #1c2230; color: var(--accent-gold); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 6px; font-size: 12px;">Продать всё</button>
        </div>
        <div class="inventory-grid" id="inventory-list">
            <div class="empty-inv">Инвентарь пуст</div>
        </div>
    </div>

    <!-- MODAL OPEN CASE -->
    <div class="modal" id="case-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modal-case-title">Кейс</h3>
            <img id="modal-case-img" src="" style="width: 100px; height: 100px; object-fit: contain; margin: 10px 0;">
            
            <div class="multiplier-selector">
                <button class="mult-btn active" onclick="setMultiplier(1)">x1</button>
                <button class="mult-btn" onclick="setMultiplier(2)">x2</button>
                <button class="mult-btn" onclick="setMultiplier(5)">x5</button>
            </div>

            <div id="modal-win-area"></div>

            <button class="btn-open" id="modal-open-btn" onclick="confirmOpenCase()">Открыть за 9 монет</button>

            <div class="case-preview-loot">
                <div style="font-size: 12px; color: var(--text-muted);">Возможный дроп:</div>
                <div class="loot-grid" id="modal-loot-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // TELEGRAM SDK INIT
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const u = tg.initDataUnsafe.user;
                document.getElementById('user-name').innerText = u.first_name || 'Игрок';
                if (u.photo_url) {
                    document.getElementById('user-avatar').innerHTML = `<img src="${u.photo_url}">`;
                } else {
                    document.getElementById('user-avatar').innerText = (u.first_name || 'U')[0];
                }
            }
        }

        // DATABASE OF ITEMS (с именами файлов с твоего скриншота)
        const ITEMS = [
            { id: 'trios', name: 'Los Trios', price: 4, img: 'assets/brainrots/los_trios.png' },
            { id: 'rot67', name: '67', price: 5, img: 'assets/brainrots/67.png' },
            { id: 'hammy', name: 'Spinny Hammy', price: 5, img: 'assets/brainrots/spinny_hammy.png' },
            { id: 'candyslap', name: 'Candy Slap', price: 7, img: 'assets/brainrots/CandySlap.png' },
            { id: 'noobinis', name: 'Los Noobinis', price: 7, img: 'assets/brainrots/Los_Noobinis.png' },
            { id: 'tangtang', name: 'Tang Tang Keletang', price: 8, img: 'assets/brainrots/TangTangKeletang.png' },
            { id: 'lagrande', name: 'La Grande', price: 9, img: 'assets/brainrots/La_Grande_Combinasion.png' },
            { id: 'tictac', name: 'Tictac Sahur', price: 12, img: 'assets/brainrots/Tictac-Sahur.png' },
            { id: 'bacuru', name: 'Bacuru and Egguru', price: 12, img: 'assets/brainrots/Bacuru_and_Egguru.png' },
            { id: 'los67', name: 'Los 67', price: 12, img: 'assets/brainrots/Los_67.png' },
            { id: 'yinyang', name: 'Yin Yang Slap', price: 20, img: 'assets/brainrots/YinYangSlap.png' },
            { id: 'skibidi', name: 'Skibidi Toilet', price: 13154, img: 'assets/brainrots/skibidi_toilet.png' }
        ];

        // GAME STATE (СТАРТОВЫЙ БАЛАНС = 0)
        let balance = parseInt(localStorage.getItem('bf_balance')) || 0;
        let inventory = JSON.parse(localStorage.getItem('bf_inventory')) || [];
        let lastFreeTime = parseInt(localStorage.getItem('bf_last_free')) || 0;

        let activeCaseType = null;
        let activeMultiplier = 1;

        // UPGRADER STATE
        let selectedInputItem = null;
        let selectedTargetItem = null;

        function updateUI() {
            document.getElementById('balance').innerText = balance;
            localStorage.setItem('bf_balance', balance);
            localStorage.setItem('bf_inventory', JSON.stringify(inventory));
            renderInventory();
            checkFreeTimer();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            
            if (tab === 'cases') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('section-cases').classList.add('active');
            } else if (tab === 'upgrader') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('section-upgrader').classList.add('active');
            } else if (tab === 'inventory') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('section-inventory').classList.add('active');
            }
        }

        // TIMER FREE CASE
        function checkFreeTimer() {
            const now = Date.now();
            const diff = now - lastFreeTime;
            const twelveHours = 12 * 3600 * 1000;

            if (diff >= twelveHours) {
                document.getElementById('free-timer-text').innerText = "БЕСПЛАТНО";
                document.getElementById('free-timer-text').style.color = "var(--accent-gold)";
            } else {
                const rem = twelveHours - diff;
                const h = Math.floor(rem / 3600000);
                const m = Math.floor((rem % 3600000) / 60000);
                document.getElementById('free-timer-text').innerText = `через ${h}ч ${m}м`;
                document.getElementById('free-timer-text').style.color = "var(--text-muted)";
            }
        }
        setInterval(checkFreeTimer, 10000);

        // MODAL CASES LOGIC
        function openCaseModal(type) {
            activeCaseType = type;
            activeMultiplier = 1;
            setMultiplier(1);

            const modal = document.getElementById('case-modal');
            document.getElementById('modal-win-area').innerHTML = '';
            
            if (type === 'free') {
                document.getElementById('modal-case-title').innerText = 'Бесплатный Кейс';
                document.getElementById('modal-case-img').src = 'assets/cases/free.png';
                renderLootGrid([
                    { name: '2 Монеты', chance: '40%' },
                    { name: '3 Монеты', chance: '30%' },
                    { name: '5 Монет', chance: '20%' },
                    { name: 'Los Trios', chance: '7%' },
                    { name: '67', chance: '3%' }
                ]);
            } else {
                document.getElementById('modal-case-title').innerText = 'Начальный Кейс';
                document.getElementById('modal-case-img').src = 'assets/cases/base.png';
                renderLootGrid(ITEMS.slice(0, 8));
            }

            modal.classList.add('active');
            updateModalBtn();
        }

        function closeModal() {
            document.getElementById('case-modal').classList.remove('active');
        }

        function setMultiplier(mult) {
            activeMultiplier = mult;
            document.querySelectorAll('.mult-btn').forEach(b => {
                b.classList.remove('active');
                if (b.innerText === 'x' + mult) b.classList.add('active');
            });
            updateModalBtn();
        }

        function updateModalBtn() {
            const btn = document.getElementById('modal-open-btn');
            if (activeCaseType === 'free') {
                const now = Date.now();
                const twelveHours = 12 * 3600 * 1000;
                if (now - lastFreeTime < twelveHours) {
                    btn.disabled = true;
                    btn.innerText = 'Еще не доступен';
                } else {
                    btn.disabled = false;
                    btn.innerText = `Открыть x${activeMultiplier} (Бесплатно)`;
                }
            } else {
                const price = 9 * activeMultiplier;
                btn.disabled = balance < price;
                btn.innerText = `Открыть x${activeMultiplier} за ${price} монет`;
            }
        }

        function renderLootGrid(items) {
            const grid = document.getElementById('modal-loot-grid');
            grid.innerHTML = items.map(i => `
                <div class="loot-item-mini">
                    <img src="${i.img || 'assets/brainrots/los_trios.png'}" onerror="this.src='https://via.placeholder.com/35'">
                    <div>${i.name}</div>
                    ${i.price ? `<div style="color:var(--accent-gold);">${i.price}</div>` : ''}
                </div>
            `).join('');
        }

        // OPEN CASE CONFIRMATION
        function confirmOpenCase() {
            if (activeCaseType === 'free') {
                const now = Date.now();
                const twelveHours = 12 * 3600 * 1000;
                if (now - lastFreeTime < twelveHours) return;
                lastFreeTime = now;
                localStorage.setItem('bf_last_free', lastFreeTime);
            } else {
                const price = 9 * activeMultiplier;
                if (balance < price) return;
                balance -= price;
            }

            let wonHTML = '<div class="won-items-container">';
            
            for (let i = 0; i < activeMultiplier; i++) {
                let win = rollDrop(activeCaseType);
                if (win.type === 'coin') {
                    balance += win.amount;
                    wonHTML += `
                        <div class="won-card">
                            <i class="fa-solid fa-coins" style="font-size:35px; color:var(--accent-gold); margin:8px 0;"></i>
                            <div class="won-card-title">+${win.amount} монет</div>
                        </div>
                    `;
                } else {
                    inventory.push(win.item);
                    wonHTML += `
                        <div class="won-card">
                            <img src="${win.item.img}" onerror="this.src='https://via.placeholder.com/50'">
                            <div class="won-card-title">${win.item.name}</div>
                            <div class="won-card-price">${win.item.price} монет</div>
                        </div>
                    `;
                }
            }
            wonHTML += '</div>';

            document.getElementById('modal-win-area').innerHTML = wonHTML;
            updateUI();
            updateModalBtn();
        }

        // ROLL DROP CHANCES
        function rollDrop(type) {
            const rand = Math.random() * 100;
            if (type === 'free') {
                // 90% монет, 10% брейнроты
                if (rand < 40) return { type: 'coin', amount: 2 };
                if (rand < 70) return { type: 'coin', amount: 3 };
                if (rand < 90) return { type: 'coin', amount: 5 };
                if (rand < 97) return { type: 'item', item: ITEMS[0] }; // Los Trios
                return { type: 'item', item: ITEMS[1] }; // 67
            } else {
                // Начальный кейс
                if (rand < 40) return { type: 'item', item: ITEMS[0] };
                if (rand < 70) return { type: 'item', item: ITEMS[1] };
                if (rand < 88) return { type: 'item', item: ITEMS[3] };
                if (rand < 98) return { type: 'item', item: ITEMS[6] };
                return { type: 'item', item: ITEMS[11] }; // Skibidi
            }
        }

        // INVENTORY RENDER
        function renderInventory() {
            const container = document.getElementById('inventory-list');
            if (inventory.length === 0) {
                container.innerHTML = `<div class="empty-inv">Инвентарь пуст</div>`;
                return;
            }

            container.innerHTML = inventory.map((item, index) => `
                <div class="item-card" onclick="selectForUpgrade(${index})">
                    <img src="${item.img}" onerror="this.src='https://via.placeholder.com/50'">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${item.price} монет</div>
                    <button class="sell-btn" onclick="event.stopPropagation(); sellItem(${index})">Продать</button>
                </div>
            `).join('');
        }

        function sellItem(index) {
            balance += inventory[index].price;
            inventory.splice(index, 1);
            updateUI();
        }

        function sellAll() {
            inventory.forEach(item => balance += item.price);
            inventory = [];
            updateUI();
        }

        // UPGRADER SYSTEM
        function selectForUpgrade(index) {
            selectedInputItem = inventory[index];
            document.getElementById('slot-input').innerHTML = `
                <img src="${selectedInputItem.img}">
                <div style="font-size:10px; font-weight:600; margin-top:2px;">${selectedInputItem.name}</div>
                <div style="font-size:10px; color:var(--accent-gold);">${selectedInputItem.price}</div>
            `;
            calculateUpgradeChance();
            switchTab('upgrader');
        }

        function openShopSelector() {
            let options = ITEMS.map(item => `${item.name} (${item.price} монет)`).join('\n');
            let choice = prompt("Введите номер предмета для цели:\n" + ITEMS.map((item, i) => `${i+1}. ${item.name} - ${item.price} монет`).join('\n'));
            if (choice && ITEMS[choice - 1]) {
                selectedTargetItem = ITEMS[choice - 1];
                document.getElementById('slot-target').innerHTML = `
                    <img src="${selectedTargetItem.img}">
                    <div style="font-size:10px; font-weight:600; margin-top:2px;">${selectedTargetItem.name}</div>
                    <div style="font-size:10px; color:var(--accent-gold);">${selectedTargetItem.price}</div>
                `;
                calculateUpgradeChance();
            }
        }

        function calculateUpgradeChance() {
            if (!selectedInputItem || !selectedTargetItem) return;
            let chance = (selectedInputItem.price / selectedTargetItem.price) * 100;
            if (chance > 95) chance = 95;
            
            document.getElementById('upgrade-chance').innerText = chance.toFixed(1) + '%';
            
            const circle = document.getElementById('upgrade-progress');
            const offset = 502 - (502 * (chance / 100));
            circle.style.strokeDashoffset = offset;

            document.getElementById('btn-upgrade').disabled = false;
        }

        function runUpgrade() {
            if (!selectedInputItem || !selectedTargetItem) return;

            const chance = (selectedInputItem.price / selectedTargetItem.price) * 100;
            const roll = Math.random() * 100;

            // Удаляем предмет из инвентаря
            const idx = inventory.findIndex(i => i.id === selectedInputItem.id);
            if (idx !== -1) inventory.splice(idx, 1);

            if (roll <= chance) {
                alert("УСПЕХ! Вы получили " + selectedTargetItem.name);
                inventory.push(selectedTargetItem);
            } else {
                alert("НЕУДАЧА! Предмет сгорел.");
            }

            // Сброс
            selectedInputItem = null;
            selectedTargetItem = null;
            document.getElementById('slot-input').innerHTML = `<span style="font-size: 11px; color: var(--text-muted);">Выбрать из инвентаря</span>`;
            document.getElementById('slot-target').innerHTML = `<span style="font-size: 11px; color: var(--text-muted);">Выбрать цель</span>`;
            document.getElementById('upgrade-chance').innerText = '0%';
            document.getElementById('upgrade-progress').style.strokeDashoffset = 502;
            document.getElementById('btn-upgrade').disabled = true;

            updateUI();
        }

        // INIT
        updateUI();
    </script>
</body>
</html>
