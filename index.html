<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brainrots Funny</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151921;
            --accent-blue: #2b6bf3;
            --accent-gold: #f5a623;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --text-main: #ffffff;
            --text-muted: #8c93a4;
            --border-color: #222834;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            padding-bottom: 30px;
            overflow-x: hidden;
        }

        /* ============ HEADER ============ */
        header {
            background: #11141d;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-profile { display: flex; align-items: center; gap: 10px; }

        .user-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--accent-blue);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 16px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .user-info { display: flex; flex-direction: column; }
        .user-name { font-size: 14px; font-weight: 700; }

        .balance-badge {
            background: #1c2230; padding: 6px 14px; border-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 6px;
            font-weight: 800; color: var(--accent-gold); font-size: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .balance-badge.bump { animation: bump 0.4s ease; }
        @keyframes bump {
            0% { transform: scale(1); }
            40% { transform: scale(1.15); color: #fff; }
            100% { transform: scale(1); }
        }

        /* ============ TABS ============ */
        .tabs { display: flex; background: #11141d; border-bottom: 1px solid var(--border-color); }

        .tab-btn {
            flex: 1; padding: 12px 0; text-align: center;
            background: none; border: none; color: var(--text-muted);
            font-size: 13px; font-weight: 700; cursor: pointer;
            transition: all 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .tab-btn i { font-size: 16px; }
        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom: 3px solid var(--accent-blue);
            background: rgba(43, 107, 243, 0.05);
        }

        /* ============ SECTIONS ============ */
        .section { display: none; padding: 16px; }
        .section.active { display: block; }

        .section-title {
            font-size: 17px; font-weight: 800; margin-bottom: 14px;
            color: var(--text-main); display: flex; align-items: center; gap: 8px;
        }

        /* ============ CASES ============ */
        .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

        .case-card {
            background: var(--card-bg); border-radius: 14px; padding: 16px;
            border: 1px solid var(--border-color); text-align: center;
            position: relative; cursor: pointer;
            transition: transform 0.15s, border-color 0.2s;
        }
        .case-card:hover { border-color: rgba(43, 107, 243, 0.5); }
        .case-card:active { transform: scale(0.96); }

        .case-img {
            width: 110px; height: 110px; object-fit: contain;
            margin: 0 auto 10px; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
        }
        .case-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
        .case-price { font-size: 13px; color: var(--accent-gold); font-weight: 700; }

        /* ============ MODALS ============ */
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px); z-index: 200;
            justify-content: center; align-items: center; padding: 16px;
            animation: fadeIn 0.2s ease;
        }
        .modal.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 20px; width: 100%; max-width: 420px; padding: 20px;
            text-align: center; position: relative;
            max-height: 90vh; overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: modalIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        .close-modal {
            position: absolute; top: 14px; right: 16px;
            font-size: 22px; color: var(--text-muted);
            cursor: pointer; transition: color 0.2s;
            width: 30px; height: 30px; line-height: 28px; text-align: center;
            border-radius: 50%;
            z-index: 2;
        }
        .close-modal:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }

        .multiplier-selector { display: flex; justify-content: center; gap: 10px; margin: 16px 0; }

        .mult-btn {
            background: #1c2230; border: 1px solid var(--border-color);
            color: var(--text-muted); padding: 8px 18px; border-radius: 10px;
            font-weight: 800; cursor: pointer; transition: all 0.2s;
        }
        .mult-btn.active {
            background: var(--accent-blue); color: #fff;
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px rgba(43, 107, 243, 0.4);
        }

        .btn-action {
            background: var(--accent-blue); color: white; border: none;
            width: 100%; padding: 14px; border-radius: 12px;
            font-weight: 800; font-size: 16px; cursor: pointer;
            margin-top: 10px; transition: background 0.2s, transform 0.1s;
        }
        .btn-action:active { transform: scale(0.98); }
        .btn-action:disabled { background: #2a3245; color: #5d667a; cursor: not-allowed; }

        /* ============ ROULETTES STACK ============ */
        .roulettes-stack {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .roulette-container {
            width: 100%; height: 110px; background: #0d1017;
            border: 2px solid var(--border-color); border-radius: 12px;
            position: relative; overflow: hidden;
        }
        .roulettes-stack .roulette-container { margin: 0; }

        .roulette-pointer {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 4px; height: 100%; background: var(--accent-gold);
            z-index: 10; box-shadow: 0 0 10px var(--accent-gold);
        }
        .roulette-pointer::before,
        .roulette-pointer::after {
            content: ''; position: absolute; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent;
        }
        .roulette-pointer::before { top: -2px; border-top: 8px solid var(--accent-gold); }
        .roulette-pointer::after  { bottom: -2px; border-bottom: 8px solid var(--accent-gold); }

        .roulette-track {
            display: flex; position: absolute; left: 0; top: 10px; height: 90px;
        }

        .roulette-item {
            min-width: 90px; width: 90px; height: 90px;
            background: #151921; border: 1px solid var(--border-color);
            border-radius: 10px; margin: 0 5px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 11px; text-align: center;
            padding: 4px; flex-shrink: 0;
        }
        .roulette-item img { width: 45px; height: 45px; object-fit: contain; }

        /* ============ LOOT PREVIEW ============ */
        .case-preview-loot {
            margin-top: 18px; border-top: 1px solid var(--border-color); padding-top: 14px;
        }

        .loot-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            margin-top: 10px; max-height: 180px; overflow-y: auto;
        }

        .loot-item-mini {
            background: #1c2230; border-radius: 10px; padding: 8px 4px;
            font-size: 11px; border: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }

        .loot-item-mini img, .loot-item-mini .coin-icon {
            width: 38px; height: 38px; object-fit: contain;
            display: flex; align-items: center; justify-content: center;
        }

        /* ============ WON CARDS ============ */
        .won-items-container {
            display: flex; justify-content: center; gap: 10px;
            flex-wrap: wrap; margin: 15px 0;
        }

        .won-card {
            background: #1c2230; border: 2px solid var(--accent-gold);
            border-radius: 12px; padding: 10px; width: 95px; text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px rgba(245, 166, 35, 0.3);
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .won-card img { width: 50px; height: 50px; object-fit: contain; }

        .won-card-title {
            font-size: 11px; font-weight: 700; margin-top: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .won-card-price { font-size: 11px; color: var(--accent-gold); font-weight: 800; }

        /* ============ UPGRADER ============ */
        .upgrade-slots { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; }

        .slot {
            flex: 1; background: var(--card-bg);
            border: 2px dashed var(--border-color); border-radius: 14px;
            height: 110px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; padding: 8px; transition: all 0.2s;
        }
        .slot.selected {
            border-style: solid; border-color: var(--accent-blue); background: #182030;
        }
        .slot img { width: 55px; height: 55px; object-fit: contain; }

        .upgrader-circle-box { position: relative; width: 220px; height: 220px; margin: 20px auto; }
        .circle-svg { transform: rotate(-90deg); }

        .upgrader-arrow {
            position: absolute; top: 50%; left: 50%;
            width: 4px; height: 80px;
            background: linear-gradient(to top, transparent, var(--accent-gold));
            transform-origin: top center;
            transform: translate(-50%, 0) rotate(0deg);
            z-index: 10; border-radius: 2px;
            box-shadow: 0 0 8px var(--accent-gold);
        }

        .upgrader-info {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); text-align: center; z-index: 5;
        }

        /* ============ INVENTORY ============ */
        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

        .item-card {
            background: var(--card-bg); border-radius: 12px; padding: 10px;
            border: 1px solid var(--border-color); text-align: center;
            cursor: pointer; transition: transform 0.1s, border-color 0.2s;
            animation: itemAppear 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes itemAppear {
            from { transform: scale(0.7); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
        .item-card:active { transform: scale(0.96); }
        .item-card:hover { border-color: rgba(43, 107, 243, 0.5); }
        .item-card img { width: 55px; height: 55px; object-fit: contain; margin-bottom: 6px; }

        .item-name {
            font-size: 11px; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .item-price { font-size: 12px; color: var(--accent-gold); font-weight: 800; margin-top: 2px; }

        .sell-btn {
            background: rgba(231, 76, 60, 0.15); color: var(--accent-red);
            border: 1px solid rgba(231, 76, 60, 0.3); border-radius: 6px;
            padding: 5px 8px; font-size: 10px; font-weight: 700;
            margin-top: 6px; cursor: pointer; width: 100%;
            transition: background 0.2s;
        }
        .sell-btn:hover { background: rgba(231, 76, 60, 0.3); }

        .empty-inv {
            grid-column: span 3; text-align: center;
            color: var(--text-muted); padding: 40px 0; font-size: 14px;
        }

        /* ============ SELECTOR GRID ============ */
        .selector-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            margin-top: 15px; max-height: 300px; overflow-y: auto;
        }

        .selector-item {
            background: #1c2230; border: 1px solid var(--border-color);
            border-radius: 10px; padding: 10px;
            display: flex; align-items: center; gap: 10px;
            cursor: pointer; text-align: left; transition: border-color 0.2s;
        }
        .selector-item:hover { border-color: var(--accent-blue); }
        .selector-item img { width: 40px; height: 40px; object-fit: contain; }

        /* ====================================================== */
        /* ================  TOAST NOTIFICATIONS  =============== */
        /* ====================================================== */

        .bf-toast-container {
            position: fixed;
            top: 78px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: calc(100% - 24px);
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            padding: 0 4px;
        }

        .bf-toast {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 14px;
            background: #1c2230;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            pointer-events: auto;
            cursor: pointer;
            overflow: hidden;
            transform: translateY(-120%);
            opacity: 0;
            animation: toastIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .bf-toast.closing { animation: toastOut 0.3s ease forwards; }

        @keyframes toastIn { to { transform: translateY(0); opacity: 1; } }
        @keyframes toastOut { to { transform: translateY(-120%); opacity: 0; } }

        .bf-toast__icon {
            flex-shrink: 0;
            width: 34px; height: 34px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }

        .bf-toast__body { flex: 1; min-width: 0; }

        .bf-toast__title {
            font-size: 13px; font-weight: 800;
            margin-bottom: 2px; letter-spacing: 0.2px;
        }

        .bf-toast__msg {
            font-size: 12.5px; font-weight: 500;
            color: var(--text-muted); word-wrap: break-word;
        }

        .bf-toast__progress {
            position: absolute;
            bottom: 0; left: 0;
            height: 3px; width: 100%;
            transform-origin: left center;
            animation: toastProgress linear forwards;
        }

        @keyframes toastProgress {
            from { transform: scaleX(1); }
            to   { transform: scaleX(0); }
        }

        .bf-toast--success { border-color: rgba(46, 204, 113, 0.5); background: linear-gradient(90deg, rgba(46,204,113,0.12), #1c2230 40%); }
        .bf-toast--success .bf-toast__icon { background: rgba(46, 204, 113, 0.2); color: var(--accent-green); }
        .bf-toast--success .bf-toast__progress { background: var(--accent-green); }

        .bf-toast--error { border-color: rgba(231, 76, 60, 0.5); background: linear-gradient(90deg, rgba(231,76,60,0.12), #1c2230 40%); }
        .bf-toast--error .bf-toast__icon { background: rgba(231, 76, 60, 0.2); color: var(--accent-red); }
        .bf-toast--error .bf-toast__progress { background: var(--accent-red); }

        .bf-toast--warning { border-color: rgba(245, 166, 35, 0.5); background: linear-gradient(90deg, rgba(245,166,35,0.12), #1c2230 40%); }
        .bf-toast--warning .bf-toast__icon { background: rgba(245, 166, 35, 0.2); color: var(--accent-gold); }
        .bf-toast--warning .bf-toast__progress { background: var(--accent-gold); }

        .bf-toast--info { border-color: rgba(43, 107, 243, 0.5); background: linear-gradient(90deg, rgba(43,107,243,0.12), #1c2230 40%); }
        .bf-toast--info .bf-toast__icon { background: rgba(43, 107, 243, 0.2); color: var(--accent-blue); }
        .bf-toast--info .bf-toast__progress { background: var(--accent-blue); }

        /* ====================================================== */
        /* ==================  CONFIRM DIALOG  ================== */
        /* ====================================================== */

        .bf-confirm-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }

        .bf-confirm {
            width: 100%; max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            animation: modalIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bf-confirm__icon {
            width: 60px; height: 60px;
            border-radius: 50%;
            margin: 0 auto 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            background: rgba(43, 107, 243, 0.15);
            color: var(--accent-blue);
        }
        .bf-confirm__icon--danger { background: rgba(231, 76, 60, 0.15); color: var(--accent-red); }
        .bf-confirm__icon--warning { background: rgba(245, 166, 35, 0.15); color: var(--accent-gold); }

        .bf-confirm__title {
            font-size: 18px; font-weight: 800;
            margin-bottom: 8px; color: var(--text-main);
        }

        .bf-confirm__msg {
            font-size: 13.5px; line-height: 1.5;
            color: var(--text-muted); margin-bottom: 20px;
        }

        .bf-confirm__actions { display: flex; gap: 10px; }

        .bf-confirm__btn {
            flex: 1;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px; font-weight: 800;
            border: none; cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .bf-confirm__btn:active { transform: scale(0.97); }

        .bf-confirm__btn--cancel {
            background: #1c2230; color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .bf-confirm__btn--cancel:hover { color: var(--text-main); }

        .bf-confirm__btn--confirm { background: var(--accent-blue); color: #fff; }
        .bf-confirm__btn--confirm:hover { filter: brightness(1.1); }

        .bf-confirm__btn--danger { background: var(--accent-red); color: #fff; }
        .bf-confirm__btn--danger:hover { filter: brightness(1.1); }
    </style>
</head>
<body>

    <header>
        <div class="user-profile">
            <div class="user-avatar" id="user-avatar">?</div>
            <div class="user-info">
                <div class="user-name" id="user-name">Игрок</div>
                <div style="font-size: 11px; color: var(--text-muted);">Brainrots Funny</div>
            </div>
        </div>
        <div class="balance-badge" id="balance-badge">
            <i class="fa-solid fa-coins"></i>
            <span id="balance">0</span>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('cases')">
            <i class="fa-solid fa-box-open"></i> Кейсы
        </button>
        <button class="tab-btn" onclick="switchTab('upgrader')">
            <i class="fa-solid fa-bolt"></i> Апгрейдер
        </button>
        <button class="tab-btn" onclick="switchTab('inventory')">
            <i class="fa-solid fa-sack-dollar"></i> Инвентарь
        </button>
    </div>

    <div id="section-cases" class="section active">
        <div class="section-title"><i class="fa-solid fa-cubes"></i> Доступные Кейсы</div>
        <div class="cases-grid">

            <div class="case-card" onclick="openCaseModal('free')">
                <img src="assets/cases/free.png" class="case-img" alt="Free Case"
                     onerror="this.onerror=null;this.src='https://via.placeholder.com/110?text=FREE+CASE'">
                <div class="case-title">Бесплатный</div>
                <div class="case-price" id="free-timer-text">БЕСПЛАТНО</div>
            </div>

            <div class="case-card" onclick="openCaseModal('base')">
                <img src="assets/cases/base.png" class="case-img" alt="Base Case"
                     onerror="this.onerror=null;this.src='https://via.placeholder.com/110?text=BASE+CASE'">
                <div class="case-title">Начальный</div>
                <div class="case-price"><i class="fa-solid fa-coins"></i> 9 монет</div>
            </div>

            <div class="case-card" onclick="openCaseModal('bro')">
                <img src="assets/cases/bro.png" class="case-img" alt="Bro Case"
                     onerror="this.onerror=null;this.src='https://via.placeholder.com/110?text=BRO+CASE'">
                <div class="case-title">Про Бро</div>
                <div class="case-price"><i class="fa-solid fa-coins"></i> 25 монет</div>
            </div>

        </div>
    </div>

    <div id="section-upgrader" class="section">
        <div class="section-title"><i class="fa-solid fa-bolt"></i> Прокачка Брейнротов</div>

        <div class="upgrade-slots">
            <div class="slot" id="slot-input" onclick="switchTab('inventory')">
                <i class="fa-solid fa-plus-circle" style="font-size:24px; color:var(--text-muted); margin-bottom:6px;"></i>
                <span style="font-size: 11px; color: var(--text-muted); text-align:center;">Из инвентаря</span>
            </div>
            <div style="color: var(--text-muted); font-size: 18px;"><i class="fa-solid fa-arrow-right"></i></div>
            <div class="slot" id="slot-target" onclick="openTargetSelector()">
                <i class="fa-solid fa-bullseye" style="font-size:24px; color:var(--text-muted); margin-bottom:6px;"></i>
                <span style="font-size: 11px; color: var(--text-muted); text-align:center;">Выбрать цель</span>
            </div>
        </div>

        <div class="upgrader-circle-box">
            <svg class="circle-svg" width="220" height="220">
                <circle cx="110" cy="110" r="90" stroke="#1c2230" stroke-width="14" fill="none" />
                <circle id="upgrade-progress" cx="110" cy="110" r="90" stroke="var(--accent-blue)" stroke-width="14" fill="none"
                        stroke-dasharray="565.5" stroke-dashoffset="565.5" style="transition: stroke-dashoffset 0.4s ease;" />
            </svg>
            <div class="upgrader-arrow" id="upgrader-arrow"></div>
            <div class="upgrader-info">
                <div style="font-size: 11px; color: var(--text-muted); font-weight:700;">ШАНС</div>
                <div id="upgrade-chance" style="font-size: 28px; font-weight: 900; color: var(--text-main);">0%</div>
            </div>
        </div>

        <button class="btn-action" id="btn-upgrade" onclick="runUpgradeAnimation()" disabled>ПРОКАЧАТЬ</button>
    </div>

    <div id="section-inventory" class="section">
        <div class="section-title" style="justify-content: space-between;">
            <span><i class="fa-solid fa-sack-dollar"></i> Мой Инвентарь</span>
            <button onclick="sellAll()" style="background: #1c2230; color: var(--accent-gold); border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight:700; cursor:pointer;">Продать всё</button>
        </div>
        <div class="inventory-grid" id="inventory-list">
            <div class="empty-inv">Инвентарь пуст</div>
        </div>
    </div>

    <!-- MODAL: CASE -->
    <div class="modal" id="case-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modal-case-title" style="font-size: 20px;">Кейс</h3>

            <div class="roulettes-stack" id="roulettes-stack"></div>

            <img id="modal-case-img" src="" alt=""
                 style="width: 100px; height: 100px; object-fit: contain; margin: 10px 0;"
                 onerror="this.onerror=null;this.src='https://via.placeholder.com/100?text=CASE'">

            <div class="multiplier-selector" id="mult-selector-box">
                <button class="mult-btn active" data-mult="1" onclick="setMultiplier(1)">x1</button>
                <button class="mult-btn" data-mult="2" onclick="setMultiplier(2)">x2</button>
                <button class="mult-btn" data-mult="5" onclick="setMultiplier(5)">x5</button>
            </div>

            <div id="modal-win-area"></div>

            <button class="btn-action" id="modal-open-btn" onclick="startCaseOpening()">Открыть</button>

            <div class="case-preview-loot">
                <div style="font-size: 12px; color: var(--text-muted); font-weight:700;">Возможно выпадет:</div>
                <div class="loot-grid" id="modal-loot-grid"></div>
            </div>
        </div>
    </div>

    <!-- MODAL: TARGET SELECTOR -->
    <div class="modal" id="target-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeTargetModal()">&times;</span>
            <h3>Выберите целевой Брейнрот</h3>
            <div style="font-size: 12px; color: var(--text-muted); margin-top:4px;">Чем дороже предмет, тем ниже шанс удачи</div>
            <div class="selector-grid" id="target-selector-list"></div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        /* ============================ CONFIG ============================ */
        const FREE_COOLDOWN   = 12 * 3600 * 1000;
        const MAX_UPGRADE_CHANCE = 95;
        const ROULETTE_WIN_INDEX = 20;
        const ROULETTE_ITEMS_TOTAL = 26;
        const CIRCUMFERENCE = 2 * Math.PI * 90;

        const ITEMS = [
            { id: 'trios',     name: 'Los Trios',           price: 4,     img: 'assets/brainrots/los_trios.png' },
            { id: 'rot67',     name: '67',                  price: 5,     img: 'assets/brainrots/67.png' },
            { id: 'hammy',     name: 'Spinny Hammy',        price: 5,     img: 'assets/brainrots/spinny_hammy.png' },
            { id: 'candyslap', name: 'Candy Slap',          price: 7,     img: 'assets/brainrots/CandySlap.png' },
            { id: 'noobinis',  name: 'Los Noobinis',        price: 7,     img: 'assets/brainrots/Los_Noobinis.png' },
            { id: 'tangtang',  name: 'Tang Tang Keletang',  price: 8,     img: 'assets/brainrots/TangTangKeletang.png' },
            { id: 'lagrande',  name: 'La Grande',           price: 9,     img: 'assets/brainrots/La_Grande_Combinasion.png' },
            { id: 'tictac',    name: 'Tictac Sahur',        price: 12,    img: 'assets/brainrots/Tictac-Sahur.png' },
            { id: 'bacuru',    name: 'Bacuru and Egguru',   price: 12,    img: 'assets/brainrots/Bacuru_and_Egguru.png' },
            { id: 'los67',     name: 'Los 67',              price: 12,    img: 'assets/brainrots/Los_67.png' },
            { id: 'yinyang',   name: 'Yin Yang Slap',       price: 20,    img: 'assets/brainrots/YinYangSlap.png' },
            { id: 'skibidi',   name: 'Skibidi Toilet',      price: 13154, img: 'assets/brainrots/skibidi_toilet.png' }
        ];

        /* ============================================================== */
        /* ================= КОНФИГУРАЦИЯ КЕЙСОВ ======================= */
        /* ============================================================== */
        /* ВАЖНО: предметы в loot.items — единственный источник дропа.    */
        /* Если предмета тут нет — он НЕ выпадет из этого кейса.          */
        /* Skibidi Toilet намеренно отсутствует во всех кейсах —          */
        /* получить его можно ТОЛЬКО через апгрейдер.                     */
        const CASE_PRICES = {
            free: 0,
            base: 9,
            bro:  25
        };

        const CASE_TITLES = {
            free: 'Бесплатный Кейс',
            base: 'Начальный Кейс',
            bro:  'Про Бро Кейс'
        };

        const CASE_IMAGES = {
            free: 'assets/cases/free.png',
            base: 'assets/cases/base.png',
            bro:  'assets/cases/bro.png'
        };

        const CASE_LOOT = {
            // Бесплатный: 90% монеты, 10% предметы (только дешёвые)
            free: {
                coinChance: 90,
                coins: [
                    { amount: 2, weight: 30 },
                    { amount: 3, weight: 40 },
                    { amount: 5, weight: 30 }
                ],
                items: [
                    { item: ITEMS[0], weight: 70 },   // Los Trios
                    { item: ITEMS[1], weight: 30 }    // 67
                ]
            },
            // Начальный: только 4 предмета, никаких дорогих дропов
            base: {
                coinChance: 0,
                coins: [],
                items: [
                    { item: ITEMS[0], weight: 30 },   // Los Trios
                    { item: ITEMS[1], weight: 30 },   // 67
                    { item: ITEMS[3], weight: 25 },   // Candy Slap
                    { item: ITEMS[6], weight: 15 }    // La Grande
                ]
            },
            // Про Бро: всё, что не попало в другие кейсы и не Skibidi
            bro: {
                coinChance: 0,
                coins: [],
                items: [
                    { item: ITEMS[2],  weight: 25 },  // Spinny Hammy (5)
                    { item: ITEMS[4],  weight: 20 },  // Los Noobinis (7)
                    { item: ITEMS[5],  weight: 18 },  // Tang Tang Keletang (8)
                    { item: ITEMS[7],  weight: 15 },  // Tictac Sahur (12)
                    { item: ITEMS[8],  weight: 10 },  // Bacuru and Egguru (12)
                    { item: ITEMS[9],  weight: 8  },  // Los 67 (12)
                    { item: ITEMS[10], weight: 4  }   // Yin Yang Slap (20)
                ]
            }
        };

        /* ======================= TELEGRAM INIT ========================= */
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
            const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
            if (u) {
                document.getElementById('user-name').innerText = u.first_name || 'Игрок';
                const avatar = document.getElementById('user-avatar');
                if (u.photo_url) {
                    avatar.innerHTML = '<img src="' + u.photo_url + '" alt="">';
                } else {
                    avatar.innerText = (u.first_name || 'U').charAt(0);
                }
            }
        }

        /* =========================================================== */
        /* ================== CUSTOM NOTIFICATION API ================= */
        /* =========================================================== */

        const TOAST_ICONS = {
            success: 'fa-circle-check',
            error:   'fa-circle-xmark',
            warning: 'fa-triangle-exclamation',
            info:    'fa-circle-info'
        };
        const TOAST_TITLES = {
            success: 'Успех',
            error:   'Ошибка',
            warning: 'Внимание',
            info:    'Инфо'
        };

        let toastContainer = null;
        function getToastContainer() {
            if (toastContainer && document.body.contains(toastContainer)) return toastContainer;
            toastContainer = document.createElement('div');
            toastContainer.className = 'bf-toast-container';
            document.body.appendChild(toastContainer);
            return toastContainer;
        }

        function notify(opts) {
            if (typeof opts === 'string') opts = { message: opts };
            const type = opts.type || 'info';
            const duration = Math.max(1000, opts.duration || 3500);
            const title = opts.title || TOAST_TITLES[type] || 'Инфо';
            const message = opts.message || '';

            const container = getToastContainer();

            const el = document.createElement('div');
            el.className = 'bf-toast bf-toast--' + type;
            el.innerHTML =
                '<div class="bf-toast__icon"><i class="fa-solid ' + (TOAST_ICONS[type] || TOAST_ICONS.info) + '"></i></div>' +
                '<div class="bf-toast__body">' +
                    '<div class="bf-toast__title">' + escapeHtml(title) + '</div>' +
                    '<div class="bf-toast__msg">' + escapeHtml(message) + '</div>' +
                '</div>' +
                '<div class="bf-toast__progress" style="animation-duration: ' + duration + 'ms;"></div>';

            container.appendChild(el);

            let closed = false;
            const close = () => {
                if (closed) return;
                closed = true;
                el.classList.add('closing');
                el.addEventListener('animationend', () => el.remove(), { once: true });
                setTimeout(() => el.remove(), 400);
            };

            const timer = setTimeout(close, duration);
            el.addEventListener('click', () => { clearTimeout(timer); close(); });

            return { close: close, el: el };
        }

        function confirmDialog(opts) {
            opts = opts || {};
            return new Promise(resolve => {
                const variant = opts.variant || 'default';
                const iconClass =
                    opts.icon ||
                    (variant === 'danger' ? 'fa-trash-can'
                     : variant === 'warning' ? 'fa-triangle-exclamation'
                     : 'fa-circle-question');

                const overlay = document.createElement('div');
                overlay.className = 'bf-confirm-overlay';
                overlay.innerHTML =
                    '<div class="bf-confirm">' +
                        '<div class="bf-confirm__icon' +
                            (variant === 'danger' ? ' bf-confirm__icon--danger' : '') +
                            (variant === 'warning' ? ' bf-confirm__icon--warning' : '') +
                        '"><i class="fa-solid ' + iconClass + '"></i></div>' +
                        '<div class="bf-confirm__title">' + escapeHtml(opts.title || 'Подтверждение') + '</div>' +
                        '<div class="bf-confirm__msg">' + escapeHtml(opts.message || '') + '</div>' +
                        '<div class="bf-confirm__actions">' +
                            '<button class="bf-confirm__btn bf-confirm__btn--cancel" data-act="cancel">' +
                                escapeHtml(opts.cancelText || 'Отмена') +
                            '</button>' +
                            '<button class="bf-confirm__btn ' +
                                (variant === 'danger' ? 'bf-confirm__btn--danger' : 'bf-confirm__btn--confirm') +
                                '" data-act="ok">' +
                                escapeHtml(opts.confirmText || 'OK') +
                            '</button>' +
                        '</div>' +
                    '</div>';

                document.body.appendChild(overlay);

                const finish = (result) => {
                    overlay.style.animation = 'fadeIn 0.2s ease reverse';
                    setTimeout(() => overlay.remove(), 180);
                    resolve(result);
                };

                overlay.querySelector('[data-act="ok"]').addEventListener('click', () => finish(true));
                overlay.querySelector('[data-act="cancel"]').addEventListener('click', () => finish(false));
                overlay.addEventListener('click', e => { if (e.target === overlay) finish(false); });

                const escHandler = (e) => {
                    if (e.key === 'Escape') { document.removeEventListener('keydown', escHandler); finish(false); }
                };
                document.addEventListener('keydown', escHandler);
            });
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /* =========================================================== */
        /* ========================== STORAGE ========================= */
        /* =========================================================== */

        function loadNumber(key) {
            const v = parseInt(localStorage.getItem(key), 10);
            return Number.isFinite(v) ? v : 0;
        }
        function loadInventory() {
            try {
                const raw = JSON.parse(localStorage.getItem('bf_inventory'));
                return Array.isArray(raw) ? raw.filter(i => i && i.id) : [];
            } catch (e) { return []; }
        }

        let balance       = loadNumber('bf_balance');
        let inventory     = loadInventory();
        let lastFreeTime  = loadNumber('bf_last_free');

        let activeCaseType   = null;
        let activeMultiplier = 1;
        let isOpening        = false;

        let selectedInputItem  = null;
        let selectedTargetItem = null;
        let isUpgrading        = false;

        /* ========================== HELPERS ============================ */
        const $ = id => document.getElementById(id);

        function saveState() {
            localStorage.setItem('bf_balance', String(balance));
            localStorage.setItem('bf_inventory', JSON.stringify(inventory));
            localStorage.setItem('bf_last_free', String(lastFreeTime));
        }

        function bumpBalance() {
            const el = $('balance-badge');
            if (!el) return;
            el.classList.remove('bump');
            void el.offsetWidth;
            el.classList.add('bump');
        }

        function weightedPick(list) {
            const total = list.reduce((s, i) => s + (i.weight || 1), 0);
            let r = Math.random() * total;
            for (const entry of list) {
                r -= (entry.weight || 1);
                if (r <= 0) return entry;
            }
            return list[list.length - 1];
        }

        /* ============================ UI =============================== */
        let prevBalance = balance;
        function updateUI() {
            $('balance').innerText = balance;
            if (balance !== prevBalance) bumpBalance();
            prevBalance = balance;

            saveState();
            renderInventory();
            checkFreeTimer();
        }

        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab-btn');
            const idx  = { cases: 0, upgrader: 1, inventory: 2 }[tab];
            if (idx === undefined) return;

            tabs.forEach(b => b.classList.remove('active'));
            tabs[idx].classList.add('active');

            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const section = $('section-' + tab);
            if (section) section.classList.add('active');
        }

        /* ======================= FREE CASE TIMER ======================= */
        function checkFreeTimer() {
            const diff = Date.now() - lastFreeTime;
            const el = $('free-timer-text');
            if (!el) return;

            if (diff >= FREE_COOLDOWN) {
                el.innerText = 'БЕСПЛАТНО';
                el.style.color = 'var(--accent-gold)';
            } else {
                const rem = FREE_COOLDOWN - diff;
                const h = Math.floor(rem / 3600000);
                const m = Math.floor((rem % 3600000) / 60000);
                el.innerText = 'через ' + h + 'ч ' + m + 'м';
                el.style.color = 'var(--text-muted)';
            }

            if ($('case-modal').classList.contains('active') && !isOpening) {
                updateModalBtn();
            }
        }
        setInterval(checkFreeTimer, 10000);

        /* ========================= CASE MODAL ========================== */
        function openCaseModal(type) {
            if (isOpening) return;
            if (!CASE_LOOT[type]) return;

            activeCaseType = type;
            activeMultiplier = 1;
            setMultiplier(1);

            $('modal-win-area').innerHTML = '';
            const stack = $('roulettes-stack');
            stack.innerHTML = '';
            stack.style.display = 'none';
            $('modal-case-img').style.display = 'block';

            // Free-кейс — множители недоступны
            $('mult-selector-box').style.display = (type === 'free') ? 'none' : 'flex';

            $('modal-case-title').innerText = CASE_TITLES[type];
            $('modal-case-img').src = CASE_IMAGES[type];

            // Превью строится из реальной таблицы дропа этого кейса
            renderLootGrid(getCasePreview(type));

            $('case-modal').classList.add('active');
            updateModalBtn();
        }

        function getCasePreview(type) {
            const cfg = CASE_LOOT[type];
            if (!cfg) return [];
            const preview = [];
            cfg.coins.forEach(c => preview.push({ name: c.amount + ' Монет', type: 'coin', val: c.amount }));
            cfg.items.forEach(e => preview.push(e.item));
            return preview;
        }

        function closeModal() {
            if (isOpening) return;
            $('case-modal').classList.remove('active');
            const stack = $('roulettes-stack');
            stack.innerHTML = '';
            stack.style.display = 'none';
        }

        function setMultiplier(mult) {
            if (isOpening) return;
            // В free-кейсе множители запрещены
            if (activeCaseType === 'free') mult = 1;
            activeMultiplier = mult;

            document.querySelectorAll('.mult-btn').forEach(b => {
                b.classList.toggle('active', Number(b.dataset.mult) === mult);
            });
            updateModalBtn();
        }

        function updateModalBtn() {
            const btn = $('modal-open-btn');
            if (!btn) return;

            if (activeCaseType === 'free') {
                if (Date.now() - lastFreeTime < FREE_COOLDOWN) {
                    btn.disabled = true;
                    btn.innerText = 'Еще не доступен';
                } else {
                    btn.disabled = false;
                    btn.innerText = 'Открыть (Бесплатно)';
                }
            } else {
                const price = CASE_PRICES[activeCaseType] * activeMultiplier;
                btn.disabled = balance < price;
                btn.innerText = 'Открыть x' + activeMultiplier + ' за ' + price + ' монет';
            }
        }

        function renderLootGrid(items) {
            $('modal-loot-grid').innerHTML = items.map(i => {
                if (i.type === 'coin') {
                    return '<div class="loot-item-mini">' +
                           '<div class="coin-icon"><i class="fa-solid fa-coins" style="font-size:26px; color:var(--accent-gold);"></i></div>' +
                           '<div>' + escapeHtml(i.name) + '</div></div>';
                }
                return '<div class="loot-item-mini">' +
                       '<img src="' + i.img + '" onerror="this.onerror=null;this.src=\'https://via.placeholder.com/38?text=ROT\'">' +
                       '<div>' + escapeHtml(i.name) + '</div>' +
                       '<div style="color:var(--accent-gold); font-weight:800;">' + i.price + '</div></div>';
            }).join('');
        }

        /* ======================== DROP LOGIC =========================== */
        // Возвращает { type: 'coin', amount } | { type: 'item', item }
        function rollDrop(type) {
            const cfg = CASE_LOOT[type];
            if (!cfg) return null;

            if (cfg.coins.length > 0 && Math.random() * 100 < cfg.coinChance) {
                const picked = weightedPick(cfg.coins);
                return { type: 'coin', amount: picked.amount };
            }
            const picked = weightedPick(cfg.items);
            return { type: 'item', item: picked.item };
        }

        /* ======================= CASE OPENING ========================== */
        function startCaseOpening() {
            if (isOpening) return;

            if (activeCaseType === 'free') {
                if (Date.now() - lastFreeTime < FREE_COOLDOWN) return;
                lastFreeTime = Date.now();
                saveState();
                checkFreeTimer();
            } else {
                const price = CASE_PRICES[activeCaseType] * activeMultiplier;
                if (balance < price) return;
                balance -= price;
            }

            isOpening = true;
            $('modal-open-btn').disabled = true;
            $('modal-case-img').style.display = 'none';
            $('mult-selector-box').style.display = 'none';
            $('modal-win-area').innerHTML = '';

            // Генерируем выигрыши
            const wonResults = [];
            for (let i = 0; i < activeMultiplier; i++) {
                wonResults.push(rollDrop(activeCaseType));
            }

            // Строим N рулеток в стеке
            const stack = $('roulettes-stack');
            stack.innerHTML = '';
            stack.style.display = 'flex';

            const instances = [];
            for (let i = 0; i < activeMultiplier; i++) {
                const inst = createRoulette(wonResults[i], activeCaseType);
                stack.appendChild(inst.wrapper);
                instances.push(inst);
            }

            // Запускаем все анимации одновременно
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    instances.forEach(inst => {
                        const winEl = inst.track.children[ROULETTE_WIN_INDEX];
                        const containerW = inst.wrapper.clientWidth;
                        let translateX;

                        if (winEl && containerW > 0) {
                            const winCenter = winEl.offsetLeft + winEl.offsetWidth / 2;
                            const jitter = (Math.random() - 0.5) * 40;
                            translateX = winCenter - containerW / 2 + jitter;
                        } else {
                            translateX = ROULETTE_WIN_INDEX * 100 + 50 - 190;
                        }

                        inst.track.style.transition = 'transform 3s cubic-bezier(0.1, 1, 0.1, 1)';
                        inst.track.style.transform = 'translateX(-' + translateX + 'px)';
                    });
                });
            });

            // Финализируем
            setTimeout(() => {
                isOpening = false;

                let html = '<div class="won-items-container">';
                let totalCoins = 0;
                const itemNames = [];

                wonResults.forEach(win => {
                    if (!win) return;
                    if (win.type === 'coin') {
                        balance += win.amount;
                        totalCoins += win.amount;
                        html += '<div class="won-card">' +
                                '<i class="fa-solid fa-coins" style="font-size:36px; color:var(--accent-gold); margin:6px 0;"></i>' +
                                '<div class="won-card-title">+' + win.amount + ' МОНЕТ</div></div>';
                    } else {
                        inventory.push(Object.assign({}, win.item));
                        itemNames.push(win.item.name);
                        html += '<div class="won-card">' +
                                '<img src="' + win.item.img + '" onerror="this.onerror=null;this.src=\'https://via.placeholder.com/50\'">' +
                                '<div class="won-card-title">' + escapeHtml(win.item.name) + '</div>' +
                                '<div class="won-card-price">' + win.item.price + ' монет</div></div>';
                    }
                });
                html += '</div>';

                $('modal-win-area').innerHTML = html;
                updateUI();
                updateModalBtn();

                // Итоговый тост
                if (activeMultiplier === 1) {
                    const w = wonResults[0];
                    if (w && w.type === 'coin') {
                        notify({
                            type: 'success',
                            title: 'Монеты!',
                            message: 'Вы получили +' + w.amount + ' монет из кейса.'
                        });
                    } else if (w) {
                        notify({
                            type: 'success',
                            title: 'Дроп!',
                            message: 'Вам выпал «' + w.item.name + '» (' + w.item.price + ' монет).'
                        });
                    }
                } else {
                    const parts = [];
                    if (totalCoins > 0) parts.push('+' + totalCoins + ' монет');
                    if (itemNames.length > 0) parts.push(itemNames.length + ' предмет(ов)');
                    notify({
                        type: 'success',
                        title: 'Открыто x' + activeMultiplier,
                        message: 'Получено: ' + parts.join(', ') + '.'
                    });
                }
            }, 3200);
        }

        // Создаёт одну рулетку и возвращает { wrapper, track }
        function createRoulette(win, caseType) {
            const wrapper = document.createElement('div');
            wrapper.className = 'roulette-container';
            wrapper.innerHTML = '<div class="roulette-pointer"></div><div class="roulette-track"></div>';
            const track = wrapper.querySelector('.roulette-track');

            // Лента собирается из настоящих дропов этого кейса — никаких «лишних» предметов
            const trackEntries = [];
            for (let i = 0; i < ROULETTE_ITEMS_TOTAL; i++) {
                trackEntries.push(rollDrop(caseType));
            }
            trackEntries[ROULETTE_WIN_INDEX] = win;

            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            track.innerHTML = trackEntries.map(entry => {
                if (!entry) return '';
                if (entry.type === 'coin') {
                    return '<div class="roulette-item">' +
                        '<i class="fa-solid fa-coins" style="font-size:30px; color:var(--accent-gold); margin-bottom:4px;"></i>' +
                        '<div style="font-weight:700;">' + entry.amount + ' Монет</div></div>';
                }
                return '<div class="roulette-item">' +
                    '<img src="' + entry.item.img + '" onerror="this.onerror=null;this.src=\'https://via.placeholder.com/45\'">' +
                    '<div style="font-weight:700;">' + escapeHtml(entry.item.name) + '</div></div>';
            }).join('');

            return { wrapper, track };
        }

        /* ========================= INVENTORY =========================== */
        function renderInventory() {
            const container = $('inventory-list');
            if (!inventory.length) {
                container.innerHTML = '<div class="empty-inv">Инвентарь пуст</div>';
                return;
            }

            container.innerHTML = inventory.map((item, index) =>
                '<div class="item-card" onclick="BF.selectForUpgrade(' + index + ')">' +
                    '<img src="' + item.img + '" onerror="this.onerror=null;this.src=\'https://via.placeholder.com/55\'">' +
                    '<div class="item-name">' + escapeHtml(item.name) + '</div>' +
                    '<div class="item-price">' + item.price + ' монет</div>' +
                    '<button class="sell-btn" onclick="event.stopPropagation();BF.sellItem(' + index + ')">Продать</button>' +
                '</div>'
            ).join('');
        }

        function clearInputSelection() {
            selectedInputItem = null;
            const slot = $('slot-input');
            slot.classList.remove('selected');
            slot.innerHTML = '<i class="fa-solid fa-plus-circle" style="font-size:24px; color:var(--text-muted); margin-bottom:6px;"></i>' +
                             '<span style="font-size: 11px; color: var(--text-muted);">Из инвентаря</span>';
        }

        function clearTargetSelection() {
            selectedTargetItem = null;
            const slot = $('slot-target');
            slot.classList.remove('selected');
            slot.innerHTML = '<i class="fa-solid fa-bullseye" style="font-size:24px; color:var(--text-muted); margin-bottom:6px;"></i>' +
                             '<span style="font-size: 11px; color: var(--text-muted);">Выбрать цель</span>';
        }

        function sellItem(index) {
            const item = inventory[index];
            if (!item) return;
            if (selectedInputItem === item) clearInputSelection();

            balance += item.price;
            inventory.splice(index, 1);
            updateUI();
            calculateUpgradeChance();

            notify({
                type: 'info',
                title: 'Продано',
                message: '«' + item.name + '» продан за ' + item.price + ' монет.'
            });
        }

        async function sellAll() {
            if (!inventory.length) {
                notify({ type: 'warning', message: 'Инвентарь уже пуст.' });
                return;
            }

            const total = inventory.reduce((sum, i) => sum + i.price, 0);
            const count = inventory.length;

            const ok = await confirmDialog({
                title: 'Продать всё?',
                message: 'Будет продано ' + count + ' предмет(ов) за ' + total + ' монет. Действие нельзя отменить.',
                confirmText: 'Продать',
                cancelText: 'Отмена',
                variant: 'danger',
                icon: 'fa-sack-dollar'
            });
            if (!ok) return;

            inventory.forEach(item => { balance += item.price; });
            inventory = [];
            clearInputSelection();
            updateUI();
            calculateUpgradeChance();

            notify({
                type: 'success',
                title: 'Всё продано',
                message: 'Вы получили ' + total + ' монет за ' + count + ' предмет(ов).'
            });
        }

        /* ========================= UPGRADER ============================ */
        function selectForUpgrade(index) {
            const item = inventory[index];
            if (!item) return;

            selectedInputItem = item;
            const slot = $('slot-input');
            slot.classList.add('selected');
            slot.innerHTML =
                '<img src="' + item.img + '" onerror="this.onerror=null;this.src=\'https://via.placeholder.com/55\'">' +
                '<div style="font-size:10px; font-weight:700; margin-top:2px;">' + escapeHtml(item.name) + '</div>' +
                '<div style="font-size:10px; color:var(--accent-gold); font-weight:800;">' + item.price + '</div>';

            calculateUpgradeChance();
            switchTab('upgrader');
        }

        function openTargetSelector() {
            const list = $('target-selector-list');
            list.innerHTML = ITEMS.map(item =>
                '<div class="selector-item" onclick="BF.chooseTargetItem(\'' + item.id + '\')">' +
                    '<img src="' + item.img + '" onerror="this.onerror=null;this.src=\'https://via.placeholder.com/40\'">' +
                    '<div>' +
                        '<div style="font-size:12px; font-weight:700;">' + escapeHtml(item.name) + '</div>' +
                        '<div style="font-size:11px; color:var(--accent-gold); font-weight:800;">' + item.price + ' монет</div>' +
                    '</div>' +
                '</div>'
            ).join('');
            $('target-modal').classList.add('active');
        }

        function closeTargetModal() {
            $('target-modal').classList.remove('active');
        }

        function chooseTargetItem(id) {
            const item = ITEMS.find(i => i.id === id);
            if (!item) return;

            selectedTargetItem = item;
            const slot = $('slot-target');
            slot.classList.add('selected');
            slot.innerHTML =
                '<img src="' + item.img + '" onerror="this.onerror=null;this.src=\'https://via.placeholder.com/55\'">' +
                '<div style="font-size:10px; font-weight:700; margin-top:2px;">' + escapeHtml(item.name) + '</div>' +
                '<div style="font-size:10px; color:var(--accent-gold); font-weight:800;">' + item.price + '</div>';

            closeTargetModal();
            calculateUpgradeChance();
        }

        function getUpgradeChance() {
            if (!selectedInputItem || !selectedTargetItem) return 0;
            const raw = (selectedInputItem.price / selectedTargetItem.price) * 100;
            return Math.max(0, Math.min(MAX_UPGRADE_CHANCE, raw));
        }

        function calculateUpgradeChance() {
            const chance = getUpgradeChance();
            $('upgrade-chance').innerText = chance.toFixed(1) + '%';

            const offset = CIRCUMFERENCE - (CIRCUMFERENCE * (chance / 100));
            $('upgrade-progress').style.strokeDashoffset = offset;

            $('btn-upgrade').disabled = !(selectedInputItem && selectedTargetItem);
        }

        function runUpgradeAnimation() {
            if (!selectedInputItem || !selectedTargetItem || isUpgrading) return;

            const idx = inventory.indexOf(selectedInputItem);
            if (idx === -1) {
                notify({ type: 'error', message: 'Этот предмет больше не в инвентаре.' });
                clearInputSelection();
                calculateUpgradeChance();
                return;
            }

            isUpgrading = true;
            $('btn-upgrade').disabled = true;

            const chance      = getUpgradeChance();
            const chanceAngle = chance * 3.6;
            const isSuccess   = (Math.random() * 100) <= chance;

            const screenAngle = isSuccess
                ? Math.random() * chanceAngle
                : chanceAngle + Math.random() * (360 - chanceAngle);

            const targetAngle   = ((screenAngle - 180) % 360 + 360) % 360;
            const totalRotation = 360 * 6 + targetAngle;

            const arrow = $('upgrader-arrow');
            void arrow.offsetWidth;
            arrow.style.transition = 'transform 3.5s cubic-bezier(0.15, 0.9, 0.2, 1)';
            arrow.style.transform  = 'translate(-50%, 0) rotate(' + totalRotation + 'deg)';

            const inputName  = selectedInputItem.name;
            const targetName = selectedTargetItem.name;
            const targetItemCopy = Object.assign({}, selectedTargetItem);

            setTimeout(() => {
                inventory.splice(idx, 1);

                if (isSuccess) {
                    inventory.push(targetItemCopy);
                    notify({
                        type: 'success',
                        title: '🎉 Апгрейд удался!',
                        message: '«' + inputName + '» → «' + targetName + '» (' + targetItemCopy.price + ' монет).',
                        duration: 4500
                    });
                } else {
                    notify({
                        type: 'error',
                        title: '💥 Апгрейд провален',
                        message: '«' + inputName + '» сгорел. Стрелка попала в красный сектор.',
                        duration: 4500
                    });
                }

                isUpgrading = false;
                clearInputSelection();
                clearTargetSelection();

                arrow.style.transition = 'none';
                arrow.style.transform  = 'translate(-50%, 0) rotate(0deg)';
                void arrow.offsetWidth;

                calculateUpgradeChance();
                updateUI();
            }, 3600);
        }

        /* ==================== BACKDROP CLOSE (UX) ====================== */
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', e => {
                if (e.target !== modal) return;
                if (modal.id === 'case-modal') closeModal();
                if (modal.id === 'target-modal') closeTargetModal();
            });
        });

        /* ======================== PUBLIC API =========================== */
        window.BF = {
            selectForUpgrade,
            sellItem,
            chooseTargetItem,
            notify,
            confirm: confirmDialog
        };
        window.switchTab           = switchTab;
        window.openCaseModal       = openCaseModal;
        window.closeModal          = closeModal;
        window.setMultiplier       = setMultiplier;
        window.startCaseOpening    = startCaseOpening;
        window.sellAll             = sellAll;
        window.openTargetSelector  = openTargetSelector;
        window.closeTargetModal    = closeTargetModal;
        window.runUpgradeAnimation = runUpgradeAnimation;

        /* =========================== INIT ============================== */
        updateUI();
        calculateUpgradeChance();
    })();
    </script>
</body>
</html>
